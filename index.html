<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Sommerduell 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

:root {
  --gb-body: #8B956D;
  --gb-body-dark: #717A56;
  --gb-body-light: #9EA882;
  --gb-screen-border: #1a1a1a;
  --gb-screen-bg: #9BBC0F;
  --gb-screen-dark: #0F380F;
  --gb-screen-mid: #306230;
  --gb-screen-light: #8BAC0F;
  --gb-screen-lightest: #9BBC0F;
  --gb-btn-ab: #7B2D8B;
  --gb-btn-dpad: #1a1a1a;
  --gb-btn-meta: #5a5a6e;
  --gb-red: #cc2200;
  --gb-ink: #0F380F;
  --gb-font: 'Press Start 2P', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #1a1a2e;
  background-image: 
    radial-gradient(ellipse at 20% 50%, rgba(123,45,139,0.15) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(139,149,109,0.1) 0%, transparent 60%);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 10px;
  font-family: var(--gb-font);
}

.gameboy {
  width: 320px;
  background: var(--gb-body);
  border-radius: 10px 10px 50px 10px;
  padding: 20px 20px 30px;
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,0.3),
    inset 0 -3px 0 rgba(0,0,0,0.3),
    inset 3px 0 0 rgba(255,255,255,0.1),
    inset -3px 0 0 rgba(0,0,0,0.2),
    0 20px 60px rgba(0,0,0,0.8),
    0 5px 20px rgba(0,0,0,0.5);
  position: relative;
  border: 2px solid var(--gb-body-dark);
  user-select: none;
}

/* Top label */
.gb-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.gb-brand {
  font-size: 7px;
  color: #2a2a2a;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-family: var(--gb-font);
}
.gb-model {
  font-size: 5px;
  color: #444;
  font-family: var(--gb-font);
}
.power-led {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--gb-red);
  box-shadow: 0 0 8px rgba(204,34,0,0.8), 0 0 3px rgba(204,34,0,1);
}

/* Screen section */
.screen-housing {
  background: #2a2a2a;
  border-radius: 8px 8px 40px 8px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: inset 0 3px 6px rgba(0,0,0,0.6);
  position: relative;
}

/* Nintendo-style lines decoration */
.screen-housing::before {
  content: '';
  position: absolute;
  top: 6px; left: 16px; right: 16px;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
}

.screen-bezel {
  background: #111;
  border-radius: 4px;
  padding: 6px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
}

.screen {
  background: var(--gb-screen-bg);
  width: 100%;
  aspect-ratio: 10/9;
  position: relative;
  overflow: hidden;
  border-radius: 2px;
  box-shadow:
    inset 0 0 20px rgba(0,0,0,0.3),
    inset 0 0 0 1px rgba(0,0,0,0.5);
}

/* Screen scanlines effect */
.screen::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,0,0,0.03) 3px,
    rgba(0,0,0,0.03) 4px
  );
  pointer-events: none;
  z-index: 100;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
}

/* Battery indicator area */
.battery-area {
  display: flex;
  justify-content: flex-end;
  margin-top: 6px;
  gap: 4px;
  align-items: center;
}
.battery-label {
  font-size: 4px;
  color: #555;
  font-family: var(--gb-font);
  letter-spacing: 0.05em;
}
.battery-icon {
  width: 14px; height: 7px;
  border: 1px solid #555;
  border-radius: 1px;
  position: relative;
  display: flex;
  align-items: center;
  padding: 1px;
}
.battery-icon::after {
  content: '';
  position: absolute;
  right: -3px; top: 50%;
  transform: translateY(-50%);
  width: 2px; height: 3px;
  background: #555;
  border-radius: 0 1px 1px 0;
}
.battery-fill {
  width: 70%; height: 100%;
  background: #4a8a4a;
  border-radius: 1px;
}

/* Controls area */
.controls-area {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding: 0 4px;
}

/* D-Pad */
.dpad {
  position: relative;
  width: 90px;
  height: 90px;
}
.dpad-h, .dpad-v {
  position: absolute;
  background: var(--gb-btn-dpad);
  border-radius: 3px;
}
.dpad-h {
  width: 90px; height: 30px;
  top: 30px; left: 0;
  box-shadow: 0 4px 0 #000, inset 0 1px 0 rgba(255,255,255,0.1);
}
.dpad-v {
  width: 30px; height: 90px;
  top: 0; left: 30px;
  box-shadow: 0 4px 0 #000, inset 0 1px 0 rgba(255,255,255,0.1);
}
.dpad-center {
  position: absolute;
  width: 30px; height: 30px;
  top: 30px; left: 30px;
  background: #111;
  z-index: 2;
}
.dpad button {
  position: absolute;
  background: transparent;
  border: none;
  color: rgba(255,255,255,0.6);
  font-size: 10px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  z-index: 3;
}
.dpad button:active { opacity: 0.5; }
#btnUp    { width:30px;height:30px; top:2px;  left:30px; }
#btnDown  { width:30px;height:30px; bottom:2px;left:30px; }
#btnLeft  { width:30px;height:30px; top:30px; left:2px; }
#btnRight { width:30px;height:30px; top:30px; right:2px; }

/* AB Buttons */
.ab-buttons {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  transform: rotate(-25deg);
  margin-right: 8px;
}
.ab-btn {
  border: none;
  border-radius: 50%;
  background: var(--gb-btn-ab);
  color: rgba(255,255,255,0.9);
  font-family: var(--gb-font);
  font-size: 8px;
  cursor: pointer;
  box-shadow: 0 5px 0 #4a1a5a, inset 0 1px 0 rgba(255,255,255,0.2);
  -webkit-tap-highlight-color: transparent;
  display: flex; align-items: center; justify-content: center;
}
.ab-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #4a1a5a; }
#btnB { width: 36px; height: 36px; margin-bottom: 8px; }
#btnA { width: 36px; height: 36px; }

/* Meta buttons */
.meta-area {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 14px;
  align-items: center;
}
.meta-btn-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.meta-btn {
  width: 36px; height: 12px;
  border: none;
  border-radius: 6px;
  background: var(--gb-btn-meta);
  box-shadow: 0 3px 0 #3a3a4e, inset 0 1px 0 rgba(255,255,255,0.1);
  transform: rotate(-10deg);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.meta-btn:active { transform: rotate(-10deg) translateY(2px); box-shadow: 0 1px 0 #3a3a4e; }
.meta-label {
  font-size: 4px;
  color: #3a3a3a;
  font-family: var(--gb-font);
  letter-spacing: 0.05em;
}

/* Speaker grille */
.speaker {
  position: absolute;
  bottom: 20px;
  right: 20px;
  display: flex;
  gap: 3px;
}
.speaker-hole {
  width: 3px;
  border-radius: 2px;
  background: rgba(0,0,0,0.4);
  box-shadow: inset 0 1px 0 rgba(0,0,0,0.5);
}

/* Bottom curve decoration */
.gb-bottom {
  display: flex;
  justify-content: center;
  margin-top: 4px;
}
.gb-bottom-text {
  font-size: 4px;
  color: rgba(0,0,0,0.3);
  font-family: var(--gb-font);
  letter-spacing: 0.15em;
}

/* Mute button small */
#btnMute {
  position: absolute;
  top: 8px;
  right: 16px;
  background: none;
  border: none;
  font-size: 4px;
  color: #444;
  font-family: var(--gb-font);
  cursor: pointer;
  padding: 2px 4px;
}

/* HUD overlay on screen */
.screen-hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  padding: 3px 4px;
  font-family: var(--gb-font);
  font-size: 5px;
  color: var(--gb-ink);
  pointer-events: none;
  z-index: 10;
  background: rgba(155,188,15,0.85);
  border-bottom: 1px solid rgba(0,0,0,0.2);
}

.screen-hint {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 3px 4px;
  font-family: var(--gb-font);
  font-size: 4px;
  color: var(--gb-ink);
  pointer-events: none;
  z-index: 10;
  background: rgba(155,188,15,0.85);
  border-top: 1px solid rgba(0,0,0,0.2);
  min-height: 14px;
  display: flex;
  align-items: center;
  line-height: 1.6;
}
</style>
</head>
<body>

<div class="gameboy">
  <button id="btnMute">♪ON</button>

  <div class="gb-label">
    <div>
      <div class="gb-brand">◉ Game Boy</div>
      <div class="gb-model">SOMMERDUELL EDITION</div>
    </div>
    <div class="power-led"></div>
  </div>

  <div class="screen-housing">
    <div class="screen-bezel">
      <div class="screen" id="screen">
        <canvas id="c" width="200" height="180"></canvas>
        <div class="screen-hud">
          <span id="hudStage">BOOT</span>
          <span id="hudScore">★0000</span>
          <span id="hudTime">00:00</span>
        </div>
        <div class="screen-hint" id="hint">Druecke START!</div>
      </div>
    </div>
    <div class="battery-area">
      <div class="battery-label">BATTERY</div>
      <div class="battery-icon"><div class="battery-fill"></div></div>
    </div>
  </div>

  <div class="controls-area">
    <div class="dpad">
      <div class="dpad-h"></div>
      <div class="dpad-v"></div>
      <div class="dpad-center"></div>
      <button id="btnUp">▲</button>
      <button id="btnDown">▼</button>
      <button id="btnLeft">◀</button>
      <button id="btnRight">▶</button>
    </div>
    <div class="ab-buttons">
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px">
        <button class="ab-btn" id="btnB">B</button>
        <span style="font-size:4px;color:#3a3a3a;font-family:var(--gb-font)">B</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px">
        <button class="ab-btn" id="btnA">A</button>
        <span style="font-size:4px;color:#3a3a3a;font-family:var(--gb-font)">A</span>
      </div>
    </div>
  </div>

  <div class="meta-area">
    <div class="meta-btn-wrap">
      <button class="meta-btn" id="btnSelect"></button>
      <span class="meta-label">SELECT</span>
    </div>
    <div class="meta-btn-wrap">
      <button class="meta-btn" id="btnStart"></button>
      <span class="meta-label">START</span>
    </div>
  </div>

  <div class="speaker">
    <div class="speaker-hole" style="height:18px"></div>
    <div class="speaker-hole" style="height:22px"></div>
    <div class="speaker-hole" style="height:20px"></div>
    <div class="speaker-hole" style="height:16px"></div>
    <div class="speaker-hole" style="height:12px"></div>
  </div>

  <div class="gb-bottom">
    <span class="gb-bottom-text">NINTENDO · GAME BOY · DMG-01</span>
  </div>
</div>

<script>
// =====================
// EINLADUNGSDATEN
// =====================
const INVITE = {
  title:    "SOMMERDUELL DER PAARE",
  subtitle: "TIME WARP EDITION",
  date:     "SA 20.06.2026",
  time:     "12:00 UHR",
  ort1:     "BAHNHOFSTR. 8",
  ort2:     "01259 DRESDEN",
  dress:    "70s / 80s / 90s",
  code:     "7890", // der geheime Code (letzte Stage)
};

// =====================
// CANVAS & CTX
// =====================
const canvas = document.getElementById("c");
const ctx    = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const W = 200, H = 180;

// =====================
// HUD REFS
// =====================
const hudStage = document.getElementById("hudStage");
const hudScore = document.getElementById("hudScore");
const hudTime  = document.getElementById("hudTime");
const hintEl   = document.getElementById("hint");

// =====================
// SOUND
// =====================
let audioCtx = null, muted = false;
function ensureAudio(){
  if(audioCtx) return;
  try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){}
}
function beep(freq=440,dur=0.06,type="square",vol=0.05){
  if(muted||!freq) return;
  ensureAudio(); if(!audioCtx) return;
  try{
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function fanfare(){ [523,659,784,988,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.08,"square",0.05),i*80)); }
function blip(){ beep(880,0.04,"square",0.04); }
function bonk(){ beep(120,0.1,"square",0.06); }
function boop(){ beep(440,0.05,"square",0.04); }
function startSnd(){ beep(330,0.07); setTimeout(()=>beep(550,0.07),80); setTimeout(()=>beep(880,0.1),160); }

document.getElementById("btnMute").addEventListener("click",()=>{
  muted=!muted;
  document.getElementById("btnMute").textContent = muted?"♪OFF":"♪ON";
  if(!muted) startSnd();
});

// =====================
// INPUT
// =====================
const inp = {up:false,down:false,left:false,right:false,A:false,B:false,start:false,select:false};
const prev= {A:false,B:false,start:false,up:false,down:false};

function bindBtn(el,key){
  el.addEventListener("touchstart",(e)=>{e.preventDefault();inp[key]=true;},{passive:false});
  el.addEventListener("touchend",(e)=>{e.preventDefault();inp[key]=false;},{passive:false});
  el.addEventListener("mousedown",()=>inp[key]=true);
  el.addEventListener("mouseup",()=>inp[key]=false);
  el.addEventListener("mouseleave",()=>inp[key]=false);
}
["up","down","left","right","A","B"].forEach(k=>bindBtn(document.getElementById("btn"+k.charAt(0).toUpperCase()+k.slice(1)),k));

document.getElementById("btnStart").addEventListener("mousedown",()=>inp.start=true);
document.getElementById("btnStart").addEventListener("mouseup",()=>inp.start=false);
document.getElementById("btnStart").addEventListener("touchstart",(e)=>{e.preventDefault();inp.start=true;},{passive:false});
document.getElementById("btnStart").addEventListener("touchend",(e)=>{e.preventDefault();inp.start=false;},{passive:false});

let selTimer=null;
document.getElementById("btnSelect").addEventListener("mousedown",()=>{ inp.select=true; selTimer=setTimeout(()=>{if(!game.finished)skipStage();},2000); });
document.getElementById("btnSelect").addEventListener("mouseup",()=>{ inp.select=false; clearTimeout(selTimer); });
document.getElementById("btnSelect").addEventListener("touchstart",(e)=>{e.preventDefault();inp.select=true;selTimer=setTimeout(()=>{if(!game.finished)skipStage();},2000);},{passive:false});
document.getElementById("btnSelect").addEventListener("touchend",(e)=>{e.preventDefault();inp.select=false;clearTimeout(selTimer);},{passive:false});

window.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowUp")    inp.up=true;
  if(e.key==="ArrowDown")  inp.down=true;
  if(e.key==="ArrowLeft")  inp.left=true;
  if(e.key==="ArrowRight") inp.right=true;
  if(e.key==="a"||e.key==="A") inp.A=true;
  if(e.key==="b"||e.key==="B") inp.B=true;
  if(e.key==="Enter") inp.start=true;
  if(e.key===" ") inp.A=true;
});
window.addEventListener("keyup",(e)=>{
  if(e.key==="ArrowUp")    inp.up=false;
  if(e.key==="ArrowDown")  inp.down=false;
  if(e.key==="ArrowLeft")  inp.left=false;
  if(e.key==="ArrowRight") inp.right=false;
  if(e.key==="a"||e.key==="A") inp.A=false;
  if(e.key==="b"||e.key==="B") inp.B=false;
  if(e.key==="Enter") inp.start=false;
  if(e.key===" ") inp.A=false;
});

// =====================
// DRAW HELPERS
// =====================
const INK  = "#0F380F";
const INK2 = "#306230";
const INK3 = "#8BAC0F";
const BG   = "#9BBC0F";

function cls(){
  ctx.fillStyle = BG;
  ctx.fillRect(0,0,W,H);
}

function px(text,x,y,sz=1,color=INK){
  ctx.save();
  ctx.fillStyle = color;
  ctx.font = `bold ${sz*6}px 'Press Start 2P', monospace`;
  ctx.textBaseline="top";
  ctx.fillText(text, Math.round(x), Math.round(y));
  ctx.restore();
}

function rect(x,y,w,h,col=INK){
  ctx.fillStyle=col;
  ctx.fillRect(Math.round(x),Math.round(y),w,h);
}

function rectOut(x,y,w,h,col=INK){
  ctx.strokeStyle=col;
  ctx.lineWidth=1;
  ctx.strokeRect(Math.round(x)+0.5,Math.round(y)+0.5,w-1,h-1);
}

function pill(x,y,w,h,col=INK){
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,h/2);
  ctx.fill();
}

function hint(t){ hintEl.textContent=t; }

// =====================
// GAME STATE
// =====================
const STAGES = ["BOOT","INTRO","WIMMELBILD","QUIZ","REAKTION","SORTIEREN","CODE","FINAL"];
const game = {
  stage:"BOOT",
  stageIdx:0,
  score:0,
  stageTime:0,
  totalTime:0,
  finished:false,
  hiddenDigits:["?","?","?","?"], // collected through stages
};

function addScore(n){
  game.score+=n;
  hudScore.textContent="★"+String(game.score).padStart(4,"0");
  blip();
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function fmtTime(s){
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(Math.floor(s%60)).padStart(2,"0");
}

function nextStage(){
  game.stageIdx=Math.min(game.stageIdx+1,STAGES.length-1);
  game.stage=STAGES[game.stageIdx];
  game.stageTime=0;
  hudStage.textContent=game.stage==="FINAL"?"FINAL":game.stage;
  initStage(game.stage);
  fanfare();
}
function skipStage(){ if(game.stage==="FINAL") return; nextStage(); }

// =====================
// STAGE: BOOT
// =====================
let bootT=0;
function initBoot(){
  bootT=0;
  hint("START druecken!");
}
function updateBoot(dt){
  bootT+=dt;
  if(inp.start && !prev.start){ startSnd(); addScore(0); nextStage(); }
}
function renderBoot(){
  cls();
  // Pixel art gameboy on screen
  rect(80,20,40,6,INK);  // top bar
  rect(76,26,48,2,INK2);
  px("GAME BOY",22,30,1.2);
  px("SOMMERDUELL",14,46,1);
  px("EDITION",38,56,1);
  rectOut(10,70,180,50,INK2);
  px("TIME WARP",30,78,1);
  px("2026",62,90,1);
  const b=Math.floor(bootT*2)%2===0;
  if(b) pill(50,136,100,14,INK);
  if(b) px("PRESS START",54,139,0.9,BG);
  px("(c)KRUEGER WORKS",18,164,0.7,INK2);
}

// =====================
// STAGE: INTRO (Story)
// =====================
let introPage=0, introCooldown=0;
const introPages=[
  ["ZEITMASCHINE","AKTIVIERT!","","Die Jahrzehnte","sind DURCH-","EINANDER!"],
  ["70er 80er 90er","sind gemischt.","","Loese Raetsel","um die Zeit","zu reparieren!"],
  ["Am Ende wartet","ein GEHEIMCODE","und die","EINLADUNG","zum grossen","SOMMERDUELL!"],
];
function initIntro(){
  introPage=0; introCooldown=0.5;
  hint("A = Weiter");
}
function updateIntro(dt){
  introCooldown-=dt;
  if(introCooldown>0) return;
  if(inp.A && !prev.A){
    boop();
    introPage++;
    if(introPage>=introPages.length){ nextStage(); return; }
    introCooldown=0.3;
  }
}
function renderIntro(){
  cls();
  const pg=introPages[introPage];
  rectOut(4,4,W-8,H-8,INK2);
  rectOut(6,6,W-12,H-12,INK3);
  px("["+(introPage+1)+"/"+introPages.length+"]",W-36,8,0.8,INK2);
  pg.forEach((line,i)=>{
    if(i===0) px(line,W/2-line.length*3.5,22,1.1);
    else if(i===1) px(line,W/2-line.length*3.5,36,1.1);
    else px(line, 14, 60+i*16, 0.9, i<2?INK:INK2);
  });
  const b=Math.floor(game.stageTime*2)%2===0;
  if(b) px("A:WEITER",W-62,H-20,0.8,INK2);
}

// =====================
// STAGE: WIMMELBILD (70er)
// =====================
// Find 70er items among mixed items
const wimmelItems=[
  // [label, decade, x, y, found]
  {l:"SCHLAG-\nHOSE", d:70, x:15,  y:28,  found:false, w:30,h:22},
  {l:"PEACE",         d:70, x:60,  y:50,  found:false, w:26,h:22},
  {l:"LAVA-\nLAMPE",  d:70, x:120, y:30,  found:false, w:28,h:22},
  {l:"DISCO-\nBALL",  d:70, x:158, y:60,  found:false, w:30,h:22},
  // distractors
  {l:"IPHONE",        d:0,  x:40,  y:100, found:false, w:28,h:18},
  {l:"LAPTOP",        d:0,  x:100, y:95,  found:false, w:30,h:18},
  {l:"SELFIE",        d:0,  x:152, y:110, found:false, w:28,h:18},
  {l:"AIRPODS",       d:0,  x:18,  y:130, found:false, w:30,h:18},
  {l:"SNAPCHAT",      d:0,  x:80,  y:130, found:false, w:36,h:18},
  {l:"NETFLIX",       d:0,  x:140, y:140, found:false, w:34,h:18},
];
let wCursor={x:100,y:90}, wCooldown=0, wFound=0, wTarget=4;
function initWimmelbild(){
  wimmelItems.forEach(it=>it.found=false);
  wCursor={x:100,y:90}; wCooldown=0; wFound=0;
  hint("Finde 4 70er-Dinge! Kreuz=Bewegen A=Auswaehlen");
}
function updateWimmelbild(dt){
  wCooldown-=dt;
  const sp=60;
  if(inp.up)    wCursor.y-=sp*dt;
  if(inp.down)  wCursor.y+=sp*dt;
  if(inp.left)  wCursor.x-=sp*dt;
  if(inp.right) wCursor.x+=sp*dt;
  wCursor.x=clamp(wCursor.x,6,W-6);
  wCursor.y=clamp(wCursor.y,20,H-20);

  if(inp.A && !prev.A && wCooldown<=0){
    wCooldown=0.3;
    wimmelItems.forEach(it=>{
      if(it.found) return;
      if(Math.abs(wCursor.x-(it.x+it.w/2))<it.w/2+4 && Math.abs(wCursor.y-(it.y+it.h/2))<it.h/2+4){
        if(it.d===70){
          it.found=true; wFound++; addScore(150);
          beep(660,0.05); setTimeout(()=>beep(880,0.05),60);
          if(wFound>=wTarget){
            game.hiddenDigits[0]="7";
            hint("Perfekt! Ziffer 7 gefunden!");
            setTimeout(()=>nextStage(),1500);
          } else {
            hint("Richtig! Noch "+(wTarget-wFound)+" zu finden!");
          }
        } else {
          bonk(); addScore(-20);
          hint("Das ist nicht aus den 70ern!");
        }
      }
    });
  }
  if(game.stageTime>120 && wFound<wTarget){ game.hiddenDigits[0]="7"; nextStage(); }
}
function renderWimmelbild(){
  cls();
  // title bar
  rect(0,0,W,14,INK);
  px("70er WIMMELBILD",4,3,0.85,BG);

  wimmelItems.forEach(it=>{
    if(it.found) return;
    const col = it.d===70 ? INK : INK2;
    rectOut(it.x,it.y,it.w,it.h,col);
    // draw small icons
    if(it.d===70) rect(it.x+1,it.y+1,3,3,INK3);
    // text
    const lines=it.l.split("\n");
    lines.forEach((ln,i)=>px(ln,it.x+2,it.y+3+i*9,0.7,col));
  });

  // found marker
  wimmelItems.filter(it=>it.found).forEach(it=>{
    rect(it.x,it.y,it.w,it.h,INK3);
    px("OK!",it.x+6,it.y+6,0.8,INK);
  });

  // cursor
  const cx=Math.round(wCursor.x), cy=Math.round(wCursor.y);
  ctx.strokeStyle=INK;
  ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(cx-6,cy); ctx.lineTo(cx+6,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy-6); ctx.lineTo(cx,cy+6); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,4,0,Math.PI*2); ctx.stroke();

  // progress
  px(wFound+"/"+wTarget+" GEFUNDEN",4,H-14,0.85,INK);
}

// STAGE: QUIZ (80er)
// =====================
const quizQs=[
  {q:"80er FILM:\nWer jagt Geister\nin New York?",   a:["GHOSTBUSTERS","X-FILES","BATMAN"],   c:0},
  {q:"80er MUSIK:\nWer sang\n'Like a Virgin'?",       a:["MADONNA","CYNDI LAUPER","TINA TURNER"], c:0},
  {q:"80er MODE:\nWas war\nIN der Mode?",              a:["SCHULTERPOLSTER","JOGGER","HOODIE"],   c:0},
  {q:"80er SPORT:\nWer gewann\nWM 1986?",              a:["ARGENTINIEN","BRASILIEN","DEUTSCHLAND"],c:0},
  {q:"80er TECH:\nWas erfand\nApple 1984?",            a:["MACINTOSH","IPHONE","IPAD"],            c:0},
  {q:"80er SPIEL:\nWas war der\nerste Gameboy?",       a:["DMG-01","NES","ATARI 2600"],            c:0},
  {q:"80er TV:\nIn welcher Serie\njagt Magnum?",       a:["HAWAII","MIAMI","LAS VEGAS"],           c:0},
  {q:"80er KULT:\nWas bedeutet\nDeLorean?",            a:["ZURUECK IN DIE\nZUKUNFT","TERMINATOR","ROBOCOP"], c:0},
];
let qIdx=0, qSel=0, qCooldown=0, qCorrect=0;
function initQuiz(){
  qIdx=0; qSel=0; qCooldown=0.5; qCorrect=0;
  hint("Hoch/Runter=Auswaehlen  A=Bestaetigen");
}
function updateQuiz(dt){
  qCooldown-=dt;
  if(qCooldown>0) return;
  if(inp.up && !prev.up){ qSel=Math.max(0,qSel-1); boop(); qCooldown=0.15; }
  if(inp.down && !prev.down){ qSel=Math.min(2,qSel+1); boop(); qCooldown=0.15; }
  if(inp.A && !prev.A){
    qCooldown=0.6;
    const q=quizQs[qIdx];
    if(qSel===q.c){
      addScore(200); qCorrect++;
      beep(660,0.05); setTimeout(()=>beep(880,0.06),60);
      hint("RICHTIG! +200");
    } else {
      bonk(); addScore(20);
      hint("Falsch! Richtig: "+q.a[q.c].split("\n")[0]);
    }
    qIdx++;
    qSel=0;
    if(qIdx>=quizQs.length){
      game.hiddenDigits[1]="8";
      setTimeout(()=>{ hint("Quiz geschafft! Ziffer 8 gefunden!"); setTimeout(nextStage,1500); },700);
    }
  }
  if(game.stageTime>150){ game.hiddenDigits[1]="8"; nextStage(); }
}
function renderQuiz(){
  cls();
  rect(0,0,W,14,INK);
  px("80er QUIZ "+(qIdx+1)+"/"+quizQs.length,4,3,0.85,BG);

  if(qIdx<quizQs.length){
    const q=quizQs[qIdx];
    rectOut(4,16,W-8,50,INK2);
    q.q.split("\n").forEach((l,i)=>px(l,8,20+i*12,0.85));

    q.a.forEach((ans,i)=>{
      const y=72+i*28;
      if(i===qSel){
        rect(4,y-1,W-8,22,INK);
        px("> "+ans.split("\n")[0],8,y+2,0.85,BG);
      } else {
        rectOut(4,y-1,W-8,22,INK2);
        px("  "+ans.split("\n")[0],8,y+2,0.85,INK2);
      }
    });
  }
}

// STAGE: REAKTION (90er)
// =====================
const reaktItems=[
  // [label, correct (90er)]
  {l:"TAMAGOTCHI",  ok:true},
  {l:"CD-ROM",      ok:true},
  {l:"SPICE GIRLS", ok:true},
  {l:"POGS",        ok:true},
  {l:"BACKSTREET\nBOYS", ok:true},
  {l:"GAMEBOY",     ok:true},
  {l:"INTERNET",    ok:true},
  {l:"HANDY (NOKIA)",ok:true},
  {l:"TIKTOK",      ok:false},
  {l:"YOUTUBE",     ok:false},
  {l:"IPHONE",      ok:false},
  {l:"CORONA",      ok:false},
  {l:"NETFLIX",     ok:false},
  {l:"SELFIE",      ok:false},
  {l:"BITCOIN",     ok:false},
  {l:"INSTAGRAM",   ok:false},
];
let rItems=[], rCurrent=null, rTimer=0, rShowTime=1.4, rWaitTime=0.8;
let rState="WAIT", rHits=0, rMisses=0, rTarget=10, rInputLock=false, rRound=0;
function initReaktion(){
  rItems=[...reaktItems].sort(()=>Math.random()-0.5);
  rCurrent=null; rTimer=rWaitTime; rState="WAIT";
  rHits=0; rMisses=0; rRound=0; rInputLock=false;
  hint("90er=A druecken! Nicht-90er=NICHTS!");
}
function updateReaktion(dt){
  rTimer-=dt;
  if(rState==="WAIT"){
    if(rTimer<=0){
      rCurrent=rItems[rRound % rItems.length];
      rRound++;
      rTimer=rShowTime;
      rState="SHOW";
      rInputLock=false;
      beep(520,0.04);
    }
  } else if(rState==="SHOW"){
    if(!rInputLock){
      if(inp.A && !prev.A){
        rInputLock=true;
        if(rCurrent.ok){
          rHits++; addScore(100);
          beep(880,0.04); setTimeout(()=>beep(1100,0.04),50);
          hint("RICHTIG! Das ist 90er!");
        } else {
          rMisses++; bonk();
          hint("FALSCH! "+rCurrent.l+" ist NICHT 90er!");
        }
        rTimer=0.1;
      }
    }
    if(rTimer<=0){
      if(!rInputLock && rCurrent && rCurrent.ok){
        // missed a correct one
        rMisses++; bonk();
        hint("ZU LANGSAM! War 90er!");
      }
      rState="WAIT";
      rTimer=rWaitTime;
      if(rHits>=rTarget){
        game.hiddenDigits[2]="9";
        hint("Super! Ziffer 9 gefunden!");
        setTimeout(nextStage,1500);
        return;
      }
    }
  }
  if(game.stageTime>120){ game.hiddenDigits[2]="9"; nextStage(); }
}
function renderReaktion(){
  cls();
  rect(0,0,W,14,INK);
  px("90er REAKTION",4,3,0.85,BG);

  // score bar
  px("OK:"+rHits+"/"+rTarget,4,16,0.85);
  px("FAIL:"+rMisses,W-52,16,0.85,INK2);

  if(rState==="SHOW" && rCurrent){
    // flash box
    const isOk=rCurrent.ok;
    rect(10,34,W-20,80,INK);
    // label
    const lines=rCurrent.l.split("\n");
    const totalH=lines.length*16;
    lines.forEach((ln,i)=>{
      const tw=ln.length*7;
      px(ln, W/2-tw/2, 54+i*16-totalH/2+20, 1.2, BG);
    });
    // hint
    if(isOk){
      rectOut(10,122,W-20,20,INK2);
      px("A = 90er! SCHNELL!",14,126,0.85,INK);
    } else {
      rectOut(10,122,W-20,20,INK3);
      px("NICHT 90er! WARTEN!",10,126,0.85,INK2);
    }
  } else {
    // waiting
    rect(10,34,W-20,80,INK3);
    const b=Math.floor(game.stageTime*3)%2===0;
    px(b?"BEREIT?":".......",30,66,1.5,INK);
    px("Gleich kommt",24,90,0.9,INK2);
    px("ein Begriff!",24,102,0.9,INK2);
  }
}

// STAGE: SORTIEREN
// =====================
// Drag items to correct decade box
const sortItems=[
  {l:"SCHLAG-\nHOSE",  d:70},
  {l:"WALKIE\nTALKIE",  d:70},
  {l:"RUBIK\nCUBE",     d:80},
  {l:"TETRIS",           d:80},
  {l:"POGS",             d:90},
  {l:"ICQ",              d:90},
];
let sortState=[], sortCursor=0, sortCooldown=0, sortDone=0;
function initSortieren(){
  sortState=sortItems.map((it,i)=>({...it,placed:false,slot:-1}));
  sortCursor=0; sortCooldown=0; sortDone=0;
  hint("Links/Rechts=Auswaehlen  A=Decade 70  B=80  START=90");
}
function updateSortieren(dt){
  sortCooldown-=dt;
  if(sortCooldown>0) return;

  // find next unplaced
  const unplaced=sortState.filter(s=>!s.placed);
  if(unplaced.length===0){ game.hiddenDigits[3]="0"; setTimeout(()=>{hint("Sortiert! Ziffer 0 gefunden!"); setTimeout(nextStage,1500);},500); return; }

  const cur=unplaced[0];

  if(inp.A && !prev.A){ // 70er
    sortCooldown=0.4;
    if(cur.d===70){ cur.placed=true; sortDone++; addScore(150); beep(660,0.05); hint("RICHTIG! 70er!"); }
    else { bonk(); addScore(-30); hint("FALSCH! Nicht 70er!"); }
  } else if(inp.B && !prev.B){ // 80er
    sortCooldown=0.4;
    if(cur.d===80){ cur.placed=true; sortDone++; addScore(150); beep(660,0.05); hint("RICHTIG! 80er!"); }
    else { bonk(); addScore(-30); hint("FALSCH! Nicht 80er!"); }
  } else if(inp.start && !prev.start){ // 90er
    sortCooldown=0.4;
    if(cur.d===90){ cur.placed=true; sortDone++; addScore(150); beep(660,0.05); hint("RICHTIG! 90er!"); }
    else { bonk(); addScore(-30); hint("FALSCH! Nicht 90er!"); }
  }

  if(game.stageTime>120){ game.hiddenDigits[3]="0"; nextStage(); }
}
function renderSortieren(){
  cls();
  rect(0,0,W,14,INK);
  px("JAHRZEHNTE SORTIEREN",2,3,0.75,BG);

  // decade boxes
  const boxes=[{l:"70er",x:4},{l:"80er",x:72},{l:"90er",x:140}];
  boxes.forEach(b=>{
    rectOut(b.x,16,60,30,INK2);
    px(b.l,b.x+12,24,1,INK2);
  });

  // button hints
  px("A=70",8,50,0.8,INK);
  px("B=80",74,50,0.8,INK);
  px("ST=90",140,50,0.8,INK);

  // current item
  const unplaced=sortState.filter(s=>!s.placed);
  if(unplaced.length>0){
    const cur=unplaced[0];
    rect(40,66,W-80,56,INK);
    cur.l.split("\n").forEach((ln,i)=>{
      const tw=ln.length*7;
      px(ln,W/2-tw/2,78+i*16,1.2,BG);
    });
    px("Wohin gehoert das?",8,128,0.8,INK2);
  }

  px(sortDone+"/"+sortItems.length+" korrekt",4,H-14,0.85,INK);
}

// =====================
// STAGE: CODE
// =====================
let codeInput=["_","_","_","_"], codePos=0, codeCooldown=0;
function initCode(){
  codeInput=["_","_","_","_"]; codePos=0; codeCooldown=0.5;
  hint("Hoch/Runter=Zahl  Rechts=Naechste  A=Bestaetigen");
}
function updateCode(dt){
  codeCooldown-=dt;
  if(codeCooldown>0) return;

  if(codeInput[codePos]==="?"||codeInput[codePos]==="_") codeInput[codePos]="0";
  let cur=parseInt(codeInput[codePos])||0;

  if(inp.up && !prev.up){ cur=(cur+1)%10; codeInput[codePos]=String(cur); boop(); codeCooldown=0.15; }
  if(inp.down && !prev.down){ cur=(cur+9)%10; codeInput[codePos]=String(cur); boop(); codeCooldown=0.15; }
  if(inp.right && !prev.right){ codePos=Math.min(3,codePos+1); boop(); codeCooldown=0.2; }
  if(inp.left){ codePos=Math.max(0,codePos-1); boop(); codeCooldown=0.2; }

  if(inp.A && !prev.A){
    const entered=codeInput.join("");
    const correct=game.hiddenDigits.join("");
    if(entered===correct || entered===INVITE.code){
      addScore(500); fanfare();
      hint("CODE KORREKT! ZEITREPARATUR!");
      setTimeout(nextStage,2000);
    } else {
      bonk(); addScore(-50);
      hint("Falscher Code! Tipp: "+game.hiddenDigits.join(""));
    }
  }
}
function renderCode(){
  cls();
  rect(0,0,W,14,INK);
  px("ZEITCODE EINGEBEN",4,3,0.8,BG);

  rectOut(4,18,W-8,60,INK2);
  px("Die Ziffern aus",10,24,0.85);
  px("den Stages:",10,36,0.85);
  px(game.hiddenDigits.join(" "),10,50,1.2,INK);

  px("CODE:",10,90,1);
  codeInput.forEach((d,i)=>{
    const x=60+i*30;
    if(i===codePos){ rect(x-2,84,22,22,INK); px(d,x+2,87,1.5,BG); }
    else { rectOut(x-2,84,22,22,INK2); px(d,x+2,87,1.5,INK); }
  });

  px("< > ZAHL AENDERN",8,116,0.8,INK2);
  px("A = BESTAETIGEN",8,128,0.8,INK2);

  const b=Math.floor(game.stageTime*2)%2===0;
  if(b) rectOut(4,142,W-8,20,INK);
  px("TIPP: "+game.hiddenDigits.join(""),14,148,0.85,INK2);
}

// =====================
// STAGE INIT DISPATCH
// =====================
function initStage(s){
  if(s==="BOOT")       initBoot();
  if(s==="INTRO")      initIntro();
  if(s==="WIMMELBILD") initWimmelbild();
  if(s==="QUIZ")       initQuiz();
  if(s==="REAKTION")   initReaktion();
  if(s==="SORTIEREN")  initSortieren();
  if(s==="CODE")       initCode();
  if(s==="FINAL")      initFinal();
  hudStage.textContent = s==="WIMMELBILD"?"70er":s==="QUIZ"?"80er":s==="REAKTION"?"90er":s;
}

// =====================
// MAIN LOOP
// =====================
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);
  last=now;

  game.stageTime+=dt;
  game.totalTime+=dt;
  hudTime.textContent=fmtTime(game.totalTime);

  // update
  const s=game.stage;
  if(s==="BOOT")       updateBoot(dt);
  if(s==="INTRO")      updateIntro(dt);
  if(s==="WIMMELBILD") updateWimmelbild(dt);
  if(s==="QUIZ")       updateQuiz(dt);
  if(s==="REAKTION")   updateReaktion(dt);
  if(s==="SORTIEREN")  updateSortieren(dt);
  if(s==="CODE")       updateCode(dt);
  if(s==="FINAL")      updateFinal(dt);

  // render
  if(s==="BOOT")       renderBoot();
  if(s==="INTRO")      renderIntro();
  if(s==="WIMMELBILD") renderWimmelbild();
  if(s==="QUIZ")       renderQuiz();
  if(s==="REAKTION")   renderReaktion();
  if(s==="SORTIEREN")  renderSortieren();
  if(s==="CODE")       renderCode();
  if(s==="FINAL")      renderFinal();

  // update prev input
  prev.A=inp.A; prev.B=inp.B; prev.start=inp.start;
  prev.up=inp.up; prev.down=inp.down;

  requestAnimationFrame(loop);
}

// INIT
initStage("BOOT");
renderBoot();
hudScore.textContent="★0000";
hudTime.textContent="00:00";
requestAnimationFrame(loop);
</script>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Sommerduell 2026</title>
<style>
:root {
  --gb: #8B956D;
  --gb-dark: #717A56;
  --gb-btn: #7B2D8B;
  --gb-dpad: #1a1a1a;
  --gb-meta: #5a5a6e;
  --gb-red: #cc2200;
  --gb-font: 'Courier New', Courier, monospace;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  background:#1a1a2e;
  display:flex; justify-content:center; align-items:center;
  min-height:100vh; padding:10px;
}
.gameboy {
  width:300px;
  background:var(--gb);
  border-radius:10px 10px 50px 10px;
  padding:16px 16px 28px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.3), inset 0 -3px 0 rgba(0,0,0,.3),
              0 20px 60px rgba(0,0,0,.8);
  border:2px solid var(--gb-dark);
  user-select:none; position:relative;
}
.gb-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.gb-brand { font:bold 8px var(--gb-font); color:#2a2a2a; letter-spacing:.08em; }
.led { width:8px;height:8px;border-radius:50%;background:var(--gb-red);box-shadow:0 0 8px rgba(204,34,0,.8); }
.screen-housing {
  background:#2a2a2a; border-radius:8px 8px 36px 8px;
  padding:12px; margin-bottom:14px;
  box-shadow:inset 0 3px 6px rgba(0,0,0,.6);
}
.screen-bezel { background:#111; border-radius:4px; padding:5px; }
.screen {
  background:#9BBC0F; width:100%; height:180px;
  position:relative; overflow:hidden; border-radius:2px;
  border:1px solid rgba(0,0,0,.5);
}
canvas { width:100%; height:180px; display:block; image-rendering:pixelated; }
.screen::after {
  content:''; position:absolute; inset:0; pointer-events:none; z-index:100;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.04) 3px,rgba(0,0,0,.04) 4px);
}
.hud {
  position:absolute; top:0; left:0; right:0;
  display:flex; justify-content:space-between;
  padding:3px 5px; z-index:10;
  background:rgba(155,188,15,.9);
  border-bottom:1px solid rgba(0,0,0,.25);
  font:bold 7px var(--gb-font); color:#0F380F;
}
.hint-bar {
  position:absolute; bottom:0; left:0; right:0;
  padding:3px 5px; z-index:10; min-height:14px;
  background:rgba(155,188,15,.9);
  border-top:1px solid rgba(0,0,0,.25);
  font:bold 6px var(--gb-font); color:#0F380F; line-height:1.5;
}
.controls { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding:0 4px; }
.dpad { position:relative; width:84px; height:84px; }
.dpad-h,.dpad-v { position:absolute; background:var(--gb-dpad); border-radius:3px; }
.dpad-h { width:84px;height:28px;top:28px;left:0;box-shadow:0 4px 0 #000; }
.dpad-v { width:28px;height:84px;top:0;left:28px;box-shadow:0 4px 0 #000; }
.dpad-c { position:absolute;width:28px;height:28px;top:28px;left:28px;background:#111;z-index:2; }
.dpad button {
  position:absolute; background:transparent; border:none;
  color:rgba(255,255,255,.6); font-size:9px; cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent; z-index:3;
  width:28px; height:28px;
}
.dpad button:active{opacity:.4;}
#btnUp{top:2px;left:28px;} #btnDown{bottom:2px;left:28px;}
#btnLeft{top:28px;left:2px;} #btnRight{top:28px;right:2px;}
.ab { display:flex;gap:8px;align-items:flex-end;transform:rotate(-20deg);margin-right:6px; }
.ab button {
  width:34px;height:34px;border:none;border-radius:50%;
  background:var(--gb-btn); color:rgba(255,255,255,.9);
  font:bold 8px var(--gb-font); cursor:pointer;
  box-shadow:0 5px 0 #4a1a5a;
  -webkit-tap-highlight-color:transparent;
}
.ab button:active{transform:translateY(3px);box-shadow:0 2px 0 #4a1a5a;}
.meta { display:flex;justify-content:center;gap:18px;margin-bottom:12px; }
.meta-w { display:flex;flex-direction:column;align-items:center;gap:2px; }
.meta button {
  width:34px;height:11px;border:none;border-radius:6px;
  background:var(--gb-meta);box-shadow:0 3px 0 #3a3a4e;
  transform:rotate(-10deg); cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.meta button:active{transform:rotate(-10deg) translateY(2px);box-shadow:0 1px 0 #3a3a4e;}
.meta-lbl{font:bold 5px var(--gb-font);color:#3a3a3a;}
.speaker { position:absolute;bottom:18px;right:16px;display:flex;gap:3px; }
.sh { border-radius:2px;background:rgba(0,0,0,.35); }
.gb-foot { text-align:center;margin-top:6px;font:4px var(--gb-font);color:rgba(0,0,0,.3);letter-spacing:.12em; }
#btnMute { position:absolute;top:6px;right:14px;background:none;border:none;font:5px var(--gb-font);color:#444;cursor:pointer;padding:2px 4px; }
</style>
</head>
<body>
<div class="gameboy">
  <button id="btnMute">SND:ON</button>
  <div class="gb-top">
    <div><div class="gb-brand">&#9679; GAME BOY</div><div style="font:4px var(--gb-font);color:#444;margin-top:2px">SOMMERDUELL EDITION</div></div>
    <div class="led"></div>
  </div>
  <div class="screen-housing">
    <div class="screen-bezel">
      <div class="screen" id="screen">
        <canvas id="c" width="200" height="180"></canvas>
        <div class="hud">
          <span id="hudS">BOOT</span>
          <span id="hudP">*0000</span>
          <span id="hudT">00:00</span>
        </div>
        <div class="hint-bar" id="hintBar">Druecke START!</div>
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-top:5px;">
      <span style="font:4px var(--gb-font);color:#555;">BATTERY</span>
      <div style="width:14px;height:7px;border:1px solid #555;border-radius:1px;padding:1px;position:relative;">
        <div style="width:70%;height:100%;background:#4a8a4a;border-radius:1px;"></div>
        <div style="position:absolute;right:-3px;top:50%;transform:translateY(-50%);width:2px;height:3px;background:#555;"></div>
      </div>
    </div>
  </div>
  <div class="controls">
    <div class="dpad">
      <div class="dpad-h"></div><div class="dpad-v"></div><div class="dpad-c"></div>
      <button id="btnUp">&#9650;</button>
      <button id="btnDown">&#9660;</button>
      <button id="btnLeft">&#9664;</button>
      <button id="btnRight">&#9654;</button>
    </div>
    <div class="ab">
      <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
        <button id="btnB">B</button>
        <span style="font:4px var(--gb-font);color:#3a3a3a;">B</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
        <button id="btnA">A</button>
        <span style="font:4px var(--gb-font);color:#3a3a3a;">A</span>
      </div>
    </div>
  </div>
  <div class="meta">
    <div class="meta-w"><button id="btnSelect"></button><span class="meta-lbl">SELECT</span></div>
    <div class="meta-w"><button id="btnStart"></button><span class="meta-lbl">START</span></div>
  </div>
  <div class="speaker">
    <div class="sh" style="width:3px;height:18px;"></div>
    <div class="sh" style="width:3px;height:22px;"></div>
    <div class="sh" style="width:3px;height:20px;"></div>
    <div class="sh" style="width:3px;height:16px;"></div>
    <div class="sh" style="width:3px;height:12px;"></div>
  </div>
  <div class="gb-foot">NINTENDO &middot; GAME BOY &middot; DMG-01</div>
</div>

<script>
// ========================
// EINLADUNGSDATEN
// ========================
var INVITE = {
  title1:"SOMMERDUELL", title2:"DER PAARE",
  sub:"TIME WARP EDITION",
  date:"SA 20.06.2026", time:"12:00 UHR",
  ort1:"BAHNHOFSTR. 8", ort2:"01259 DRESDEN",
  dress:"70s / 80s / 90s",
};

// ========================
// CANVAS
// ========================
var canvas=document.getElementById("c");
var ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;
var W=200, H=180;

var hudSEl=document.getElementById("hudS");
var hudPEl=document.getElementById("hudP");
var hudTEl=document.getElementById("hudT");
var hintEl=document.getElementById("hintBar");

// ========================
// SOUND
// ========================
var audioCtx=null, muted=false;
function ensureAudio(){ if(audioCtx) return; try{ audioCtx=new(window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function beep(f,d,t,v){ if(muted) return; ensureAudio(); if(!audioCtx) return; try{ var o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type=t||"square"; o.frequency.value=f; g.gain.value=v||0.05; o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+(d||0.06)); }catch(e){} }
function fanfare(){ [523,659,784,988].forEach(function(f,i){ setTimeout(function(){ beep(f,0.08,"square",0.05); },i*80); }); }
function blip(){ beep(880,0.04,"square",0.04); }
function bonk(){ beep(120,0.1,"square",0.06); }
function boop(){ beep(440,0.05,"square",0.04); }
function startSnd(){ beep(330,0.07); setTimeout(function(){beep(550,0.07);},80); setTimeout(function(){beep(880,0.1);},160); }
document.getElementById("btnMute").addEventListener("click",function(){ muted=!muted; document.getElementById("btnMute").textContent=muted?"SND:OFF":"SND:ON"; if(!muted) startSnd(); });

// ========================
// INPUT
// ========================
var inp={up:false,down:false,left:false,right:false,A:false,B:false,start:false,select:false};
var prev={up:false,down:false,left:false,right:false,A:false,B:false,start:false};

function bindBtn(id,key){
  var el=document.getElementById(id);
  el.addEventListener("touchstart",function(e){e.preventDefault();inp[key]=true;},{passive:false});
  el.addEventListener("touchend",function(e){e.preventDefault();inp[key]=false;},{passive:false});
  el.addEventListener("mousedown",function(){inp[key]=true;});
  el.addEventListener("mouseup",function(){inp[key]=false;});
  el.addEventListener("mouseleave",function(){inp[key]=false;});
}
bindBtn("btnUp","up"); bindBtn("btnDown","down"); bindBtn("btnLeft","left"); bindBtn("btnRight","right");
bindBtn("btnA","A"); bindBtn("btnB","B");

document.getElementById("btnStart").addEventListener("mousedown",function(){inp.start=true;});
document.getElementById("btnStart").addEventListener("mouseup",function(){inp.start=false;});
document.getElementById("btnStart").addEventListener("touchstart",function(e){e.preventDefault();inp.start=true;},{passive:false});
document.getElementById("btnStart").addEventListener("touchend",function(e){e.preventDefault();inp.start=false;},{passive:false});

var selTimer=null;
document.getElementById("btnSelect").addEventListener("mousedown",function(){ inp.select=true; selTimer=setTimeout(function(){if(!game.finished)skipStage();},2000); });
document.getElementById("btnSelect").addEventListener("mouseup",function(){ inp.select=false; clearTimeout(selTimer); });
document.getElementById("btnSelect").addEventListener("touchstart",function(e){e.preventDefault();inp.select=true;selTimer=setTimeout(function(){if(!game.finished)skipStage();},2000);},{passive:false});
document.getElementById("btnSelect").addEventListener("touchend",function(e){e.preventDefault();inp.select=false;clearTimeout(selTimer);},{passive:false});

window.addEventListener("keydown",function(e){
  if(e.key==="ArrowUp")    inp.up=true;
  if(e.key==="ArrowDown")  inp.down=true;
  if(e.key==="ArrowLeft")  inp.left=true;
  if(e.key==="ArrowRight") inp.right=true;
  if(e.key==="a"||e.key==="A") inp.A=true;
  if(e.key==="b"||e.key==="B") inp.B=true;
  if(e.key===" "||e.key==="Enter") inp.start=true;
});
window.addEventListener("keyup",function(e){
  if(e.key==="ArrowUp")    inp.up=false;
  if(e.key==="ArrowDown")  inp.down=false;
  if(e.key==="ArrowLeft")  inp.left=false;
  if(e.key==="ArrowRight") inp.right=false;
  if(e.key==="a"||e.key==="A") inp.A=false;
  if(e.key==="b"||e.key==="B") inp.B=false;
  if(e.key===" "||e.key==="Enter") inp.start=false;
});

// ========================
// DRAW HELPERS
// ========================
var INK="#0F380F", INK2="#306230", INK3="#8BAC0F", BG="#9BBC0F";

function cls(){ ctx.fillStyle=BG; ctx.fillRect(0,0,W,H); }
function filled(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),w,h); }
function outlined(x,y,w,h,c){ ctx.strokeStyle=c; ctx.lineWidth=1; ctx.strokeRect(Math.round(x)+.5,Math.round(y)+.5,w-1,h-1); }
function px(t,x,y,s,c){
  ctx.save(); ctx.fillStyle=c||INK;
  ctx.font="bold "+Math.round((s||1)*7)+"px 'Courier New',monospace";
  ctx.textBaseline="top"; ctx.fillText(t,Math.round(x),Math.round(y)); ctx.restore();
}
function hpBar(x,y,w,hp,mx){
  outlined(x,y,w,7,INK);
  var pct=hp/mx;
  ctx.fillStyle=pct>0.5?INK2:INK;
  ctx.fillRect(x+1,y+1,Math.round((w-2)*Math.max(0,pct)),5);
}
function hint(t){ hintEl.textContent=t; }
function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function fmtTime(s){ return (""+Math.floor(s/60)).padStart(2,"0")+":"+(""+Math.floor(s%60)).padStart(2,"0"); }

// ========================
// GAME STATE
// ========================
var STAGES=["BOOT","INTRO","BATTLE70","QUIZ80","REAK90","SORT","CODE","FINAL"];
var game={ stage:"BOOT", stageIdx:0, score:0, stageTime:0, totalTime:0, finished:false, digits:["7","8","9","0"] };

function addScore(n){ game.score+=n; hudPEl.textContent="*"+(""+game.score).padStart(4,"0"); if(n>0) blip(); }
function nextStage(){
  game.stageIdx=Math.min(game.stageIdx+1,STAGES.length-1);
  game.stage=STAGES[game.stageIdx];
  game.stageTime=0;
  var labels={"BOOT":"BOOT","INTRO":"INTRO","BATTLE70":"70er","QUIZ80":"80er","REAK90":"90er","SORT":"SORT","CODE":"CODE","FINAL":"FINAL"};
  hudSEl.textContent=labels[game.stage]||game.stage;
  initStage(game.stage); fanfare();
}
function skipStage(){ if(game.stage==="FINAL") return; nextStage(); }

// ========================
// BOOT
// ========================
var bootT=0;
function initBoot(){ bootT=0; hint("START druecken!"); }
function updateBoot(dt){ bootT+=dt; if(inp.start&&!prev.start){ startSnd(); nextStage(); } }
function renderBoot(){
  cls();
  filled(0,0,W,16,INK);
  px("* GAME BOY *",34,3,1,BG);
  px("SOMMERDUELL",20,28,1.2);
  px("DER PAARE",28,44,1.2);
  outlined(10,62,W-20,40,INK2);
  px("TIME WARP",30,70,1);
  px("EDITION 2026",16,84,1,INK2);
  var b=Math.floor(bootT*2)%2===0;
  if(b){ filled(40,118,120,16,INK); px("PRESS  START",44,121,.9,BG); }
  px("(c) KRUEGER WORKS",14,160,.75,INK2);
}

// ========================
// INTRO
// ========================
var introP=0, introCool=0;
var introPages=[
  ["** ZEITALARM **","","Die Jahrzehnte","70er 80er 90er","sind durch-","einander!"],
  ["Loese 4 Raetsel","um die Zeit zu","reparieren!","","Jede Stage gibt","eine Ziffer."],
  ["Am Ende knackst","du den CODE und","bekommst die","Einladung zum","SOMMERDUELL!","Viel Glueck!"],
];
function initIntro(){ introP=0; introCool=0.5; hint("A = Weiter"); }
function updateIntro(dt){
  introCool-=dt;
  if(introCool>0) return;
  if(inp.A&&!prev.A){ boop(); introP++; if(introP>=introPages.length){ nextStage(); return; } introCool=0.3; }
}
function renderIntro(){
  cls();
  outlined(4,4,W-8,H-8,INK2);
  px("["+(introP+1)+"/"+introPages.length+"]",W-32,8,.8,INK2);
  introPages[introP].forEach(function(l,i){ px(l,10,18+i*16,.9,i===0?INK:INK2); });
  var b=Math.floor(game.stageTime*2)%2===0;
  if(b) px("A:WEITER",W-58,H-16,.8,INK2);
}

// ========================
// BATTLE 70er (Pokemon Style)
// ========================
var bt={
  pHP:30,pMax:30, eHP:30,eMax:30,
  state:"MENU", sel:0, msg:"", msgT:0,
  shakeE:0, shakeP:0, flash:0, round:0,
};
var moves=[
  {n:"DISCO-BLITZ", dmg:[8,13], pp:5,max:5},
  {n:"PEACE-STRAHL", dmg:[5,10], pp:6,max:6},
  {n:"SCHLAG-KICK",  dmg:[10,16],pp:3,max:3},
  {n:"LAVA-WELLE",   dmg:[4,7],  pp:8,max:8},
];
var eMoves=[
  {n:"WIFI-BLAST",   dmg:[5,10]},
  {n:"SELFIE-ANGRIFF",dmg:[4,8]},
  {n:"TIKTOK-WELLE", dmg:[7,12]},
  {n:"STREAM-SCHOCK",dmg:[3,7]},
];
function initBATTLE(){
  bt.pHP=30;bt.pMax=30;bt.eHP=30;bt.eMax=30;
  bt.state="MENU";bt.sel=0;bt.msg="";bt.msgT=0;
  bt.shakeE=0;bt.shakeP=0;bt.flash=0;bt.round=0;
  moves.forEach(function(m){m.pp=m.max;});
  hint("Hoch/Runter=Angriff auswaehlen  A=Angreifen");
}
function updateBATTLE(dt){
  bt.shakeE=Math.max(0,bt.shakeE-dt*8);
  bt.shakeP=Math.max(0,bt.shakeP-dt*8);
  bt.flash=Math.max(0,bt.flash-dt);
  if(bt.state==="MSG"){
    bt.msgT-=dt;
    if(bt.msgT<=0){
      if(bt.eHP<=0){ bt.state="WIN"; addScore(500); setTimeout(nextStage,2000); hint("DISCOMON hat gewonnen!"); }
      else if(bt.pHP<=0){ bt.state="LOSE"; bonk(); setTimeout(function(){ bt.pHP=30;bt.eHP=30;bt.state="MENU"; hint("Nochmal! A=Angreifen"); },2500); }
      else { bt.state="MENU"; }
    }
    return;
  }
  if(bt.state==="MENU"){
    if(inp.up&&!prev.up){ bt.sel=Math.max(0,bt.sel-1); boop(); }
    if(inp.down&&!prev.down){ bt.sel=Math.min(3,bt.sel+1); boop(); }
    if(inp.A&&!prev.A){
      var mv=moves[bt.sel];
      if(mv.pp<=0){ bonk(); bt.msg="Keine PP mehr!"; bt.msgT=1; bt.state="MSG"; return; }
      mv.pp--;bt.round++;
      var pdmg=rnd(mv.dmg[0],mv.dmg[1]);
      bt.eHP=Math.max(0,bt.eHP-pdmg); bt.shakeE=0.35; bt.flash=0.2;
      beep(660,.04); setTimeout(function(){beep(440,.04);},60);
      if(bt.eHP<=0){ bt.msg=mv.n+" trifft!\nZEITMON besiegt!\n+500 Punkte!"; bt.msgT=2; bt.state="MSG"; return; }
      var em=eMoves[rnd(0,eMoves.length-1)];
      var edmg=rnd(em.dmg[0],em.dmg[1]);
      bt.pHP=Math.max(0,bt.pHP-edmg); bt.shakeP=0.3; bonk();
      if(bt.pHP<=0){ bt.msg=mv.n+" trifft!\nFeind: "+em.n+"!\nDISCOMON k.o.!"; bt.msgT=2.5; bt.state="MSG"; return; }
      bt.msg=mv.n+"!\n-"+pdmg+"HP\nFeind: "+em.n+"\n-"+edmg+"HP";
      bt.msgT=1.8; bt.state="MSG";
    }
  }
  if(game.stageTime>200){ nextStage(); }
}
function drawMon(x,y,sz,isEnemy){
  if(isEnemy){
    filled(x,y,sz,sz,INK);
    filled(x+2,y+2,sz-4,sz-4,BG);
    filled(x+4,y+4,5,5,INK); filled(x+sz-9,y+4,5,5,INK);
    filled(x+4,y+sz-7,sz-8,3,INK);
    filled(x+sz/2-1,y-7,2,7,INK); filled(x+sz/2-4,y-9,8,3,INK);
  } else {
    ctx.fillStyle=INK;
    ctx.beginPath(); ctx.arc(x+sz/2,y+sz/2,sz/2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=BG;
    ctx.fillRect(x+sz/2-7,y+sz/2-6,5,5); ctx.fillRect(x+sz/2+2,y+sz/2-6,5,5);
    ctx.beginPath(); ctx.arc(x+sz/2,y+sz/2+3,5,0,Math.PI); ctx.fill();
    ctx.fillStyle=INK3;
    ctx.fillRect(x+2,y+3,2,2); ctx.fillRect(x+sz-4,y+3,2,2); ctx.fillRect(x+sz/2,y+1,2,2);
  }
}
function renderBATTLE(){
  cls();
  var ex=bt.shakeE>0?Math.round(Math.sin(bt.shakeE*40)*3):0;
  var epx2=bt.shakeP>0?Math.round(Math.sin(bt.shakeP*40)*3):0;
  if(bt.flash<=0||Math.floor(bt.flash*10)%2===0) drawMon(108+ex,6,36,true);
  px("ZEITMON",4,6,.9);
  px("Lv."+Math.max(1,bt.round),4,18,.8,INK2);
  hpBar(4,28,80,bt.eHP,bt.eMax);
  px("HP",4,37,.75,INK2);
  filled(0,52,W,2,INK2);
  drawMon(2+epx2,55,34,false);
  px("DISCOMON",80,55,.9);
  px("Lv.10",80,67,.8,INK2);
  hpBar(80,77,115,bt.pHP,bt.pMax);
  px("HP:"+bt.pHP+"/"+bt.pMax,80,86,.75,INK2);
  filled(0,98,W,2,INK);

// ========================
var qs=[
  {q:"80er FILM:\nWer jagt Geister\nin New York?",        a:["GHOSTBUSTERS","X-FILES","BATMAN"],    c:0},
  {q:"80er MUSIK:\nWer sang\n'Like a Virgin'?",            a:["MADONNA","CYNDI LAUPER","TINA TURNER"],c:0},
  {q:"80er MODE:\nWas war IN\nder Mode?",                  a:["SCHULTERPOLSTER","JOGGER","HOODIE"],  c:0},
  {q:"80er SPORT:\nWer gewann\ndie WM 1986?",              a:["ARGENTINIEN","BRASILIEN","DEUTSCHLAND"],c:0},
  {q:"80er TECH:\nWas erfand Apple\nim Jahr 1984?",        a:["MACINTOSH","IPHONE","IPAD"],          c:0},
  {q:"80er GAME:\nWie heisst der\noriginal Gameboy?",      a:["DMG-01","NES","ATARI 2600"],          c:0},
  {q:"80er TV:\nIn welchem Staat\njagt Magnum?",           a:["HAWAII","MIAMI","LAS VEGAS"],         c:0},
  {q:"80er KULT:\nDeLorean ist aus\nwelchem Film?",        a:["BACK TO\nTHE FUTURE","TERMINATOR","ROBOCOP"],c:0},
];
var qI=0,qSel=0,qCool=0;
function initQUIZ(){ qI=0;qSel=0;qCool=0.5; hint("Hoch/Runter=Auswaehlen  A=Bestaetigen"); }
function updateQUIZ(dt){
  qCool-=dt; if(qCool>0) return;
  if(inp.up&&!prev.up){ qSel=Math.max(0,qSel-1); boop(); qCool=0.15; }
  if(inp.down&&!prev.down){ qSel=Math.min(2,qSel+1); boop(); qCool=0.15; }
  if(inp.A&&!prev.A){
    qCool=0.7;
    var q=qs[qI];
    if(qSel===q.c){ addScore(200); beep(660,.05); setTimeout(function(){beep(880,.06);},60); hint("RICHTIG! +200"); }
    else { bonk(); addScore(20); hint("Falsch! War: "+q.a[q.c].split("\n")[0]); }
    qI++; qSel=0;
    if(qI>=qs.length){ setTimeout(nextStage,1200); }
  }
  if(game.stageTime>160) nextStage();
}
function renderQUIZ(){
  cls();
  filled(0,0,W,16,INK);
  px("80er QUIZ "+(qI+1)+"/"+qs.length,4,3,.85,BG);
  if(qI<qs.length){
    var q=qs[qI];
    outlined(4,18,W-8,48,INK2);
    q.q.split("\n").forEach(function(l,i){ px(l,8,22+i*12,.85); });
    q.a.forEach(function(ans,i){
      var y=70+i*30;
      if(i===qSel){ filled(4,y-1,W-8,24,INK); px("> "+ans.split("\n")[0],8,y+3,.85,BG); }
      else { outlined(4,y-1,W-8,24,INK2); px("  "+ans.split("\n")[0],8,y+3,.85,INK2); }
    });
  }
}

// ========================
// REAKTION 90er
// ========================
var rAll=[
  {l:"TAMAGOTCHI",ok:true},{l:"CD-ROM",ok:true},{l:"SPICE GIRLS",ok:true},
  {l:"POGS",ok:true},{l:"BACKSTREET BOYS",ok:true},{l:"GAMEBOY COLOR",ok:true},
  {l:"INTERNET",ok:true},{l:"NOKIA 3310",ok:true},{l:"ICQ",ok:true},
  {l:"TIKTOK",ok:false},{l:"YOUTUBE",ok:false},{l:"IPHONE",ok:false},
  {l:"CORONA",ok:false},{l:"NETFLIX",ok:false},{l:"BITCOIN",ok:false},
  {l:"INSTAGRAM",ok:false},{l:"AIRPODS",ok:false},{l:"ZOOM",ok:false},
];
var rPool=[],rCur=null,rTimer=0,rState="WAIT",rHits=0,rMiss=0,rTarget=8,rLock=false,rRound=0;
function initREAK(){
  rPool=rAll.slice().sort(function(){return Math.random()-.5;});
  rCur=null;rTimer=1.0;rState="WAIT";rHits=0;rMiss=0;rRound=0;rLock=false;
  hint("90er Begriff? A druecken! Kein 90er? Warten!");
}
function updateREAK(dt){
  rTimer-=dt;
  if(rState==="WAIT"){
    if(rTimer<=0){ rCur=rPool[rRound%rPool.length]; rRound++; rTimer=1.3; rState="SHOW"; rLock=false; beep(520,.04); }
  } else if(rState==="SHOW"){
    if(!rLock && inp.A && !prev.A){
      rLock=true;
      if(rCur.ok){ rHits++; addScore(100); beep(880,.04); setTimeout(function(){beep(1100,.04);},50); hint("RICHTIG! 90er!"); }
      else { rMiss++; bonk(); hint("FALSCH! "+rCur.l+" ist NICHT 90er!"); }
      rTimer=0.1;
    }
    if(rTimer<=0){
      if(!rLock && rCur && rCur.ok){ rMiss++; bonk(); hint("ZU LANGSAM!"); }
      rState="WAIT"; rTimer=0.9;
      if(rHits>=rTarget){ setTimeout(nextStage,1000); hint("Super! Alle 90er erkannt!"); return; }
    }
  }
  if(game.stageTime>130) nextStage();
}
function renderREAK(){
  cls();
  filled(0,0,W,16,INK);
  px("90er REAKTION",4,3,.85,BG);
  px("OK:"+rHits+"/"+rTarget,4,18,.85);
  px("FAIL:"+rMiss,W-52,18,.85,INK2);
  if(rState==="SHOW"&&rCur){
    filled(10,34,W-20,78,INK);
    var lines=rCur.l.split(" "), line1=lines[0], line2=lines.slice(1).join(" ");
    if(rCur.l.length>12&&lines.length>1){
      px(line1,W/2-line1.length*4.5,52,1.3,BG);
      px(line2,W/2-line2.length*4.5,72,1.3,BG);
    } else {
      px(rCur.l,W/2-rCur.l.length*4.5,64,1.3,BG);
    }
    var b=Math.floor(game.stageTime*4)%2===0;
    if(rCur.ok){ filled(10,118,W-20,20,b?INK:INK2); px("A DRUECKEN! 90er!",14,122,.85,BG); }
    else { filled(10,118,W-20,20,INK3); px("WARTEN! KEIN 90er",14,122,.85,INK); }
  } else {
    outlined(10,34,W-20,78,INK2);
    var b2=Math.floor(game.stageTime*3)%2===0;
    px(b2?"BEREIT?":"......",36,66,1.4);
    px("Gleich erscheint",14,94,.85,INK2);
    px("ein Begriff!",26,106,.85,INK2);
  }
}

// ========================
// SORTIEREN
// ========================
var sortAll=[
  {l:"SCHLAG-\nHOSE",d:70},{l:"FLOWER\nPOWER",d:70},
  {l:"RUBIK'S\nCUBE",d:80},{l:"TETRIS",d:80},
  {l:"POGS",d:90},{l:"ICQ",d:90},
];
var sortList=[],sortCool=0,sortDone=0;
function initSORT(){
  sortList=sortAll.map(function(x){return Object.assign({},x,{placed:false});});
  sortCool=0;sortDone=0;
  hint("A=70er  B=80er  START=90er");
}
function updateSORT(dt){
  sortCool-=dt; if(sortCool>0) return;
  var cur=null;
  for(var i=0;i<sortList.length;i++){ if(!sortList[i].placed){cur=sortList[i];break;} }
  if(!cur){ setTimeout(nextStage,1500); hint("Perfekt sortiert!"); return; }
  function check(d){ sortCool=0.5; if(cur.d===d){ cur.placed=true;sortDone++;addScore(150);beep(660,.05);hint("RICHTIG! "+d+"er!"); } else { bonk();addScore(-30);hint("FALSCH! Ist "+cur.d+"er!"); } }
  if(inp.A&&!prev.A) check(70);
  else if(inp.B&&!prev.B) check(80);
  else if(inp.start&&!prev.start) check(90);
  if(game.stageTime>130) nextStage();
}
function renderSORT(){
  cls();
  filled(0,0,W,16,INK);
  px("JAHRZEHNTE SORT.",4,3,.85,BG);
  [{l:"70er",x:4,btn:"A"},{l:"80er",x:72,btn:"B"},{l:"90er",x:140,btn:"ST"}].forEach(function(b){
    outlined(b.x,18,58,28,INK2); px(b.l,b.x+8,22,1,INK2); px(b.btn+"="+b.l,b.x+4,38,.75,INK);
  });
  var cur=null;
  for(var i=0;i<sortList.length;i++){if(!sortList[i].placed){cur=sortList[i];break;}}
  if(cur){
    filled(30,58,140,54,INK);
    var lines=cur.l.split("\n");
    lines.forEach(function(l,i){ px(l,W/2-l.length*4.5,70+i*16,1.2,BG); });
    px("Wohin gehoert das?",8,118,.8,INK2);
  }
  px(sortDone+"/"+sortAll.length+" korrekt",4,H-14,.85,INK);
}

// ========================
// CODE
// ========================
var codeDigits=["0","0","0","0"],codePos=0,codeCool=0,codeMsg="";
function initCODE(){
  codeDigits=["0","0","0","0"];codePos=0;codeCool=0.5;codeMsg="";
  hint("Hoch/Runter=Zahl  Rechts=weiter  A=Bestaetigen");
}
function updateCODE(dt){
  codeCool-=dt; if(codeCool>0) return;
  var cur=parseInt(codeDigits[codePos])||0;
  if(inp.up&&!prev.up){ cur=(cur+1)%10; codeDigits[codePos]=""+cur; boop(); codeCool=0.15; }
  if(inp.down&&!prev.down){ cur=(cur+9)%10; codeDigits[codePos]=""+cur; boop(); codeCool=0.15; }
  if(inp.right&&!prev.right){ codePos=Math.min(3,codePos+1); boop(); codeCool=0.2; }
  if(inp.left&&!prev.left){ codePos=Math.max(0,codePos-1); boop(); codeCool=0.2; }
  if(inp.A&&!prev.A){
    var entered=codeDigits.join("");
    if(entered===game.digits.join("")){ addScore(500); fanfare(); codeMsg="CODE KORREKT!"; setTimeout(nextStage,2000); }
    else { bonk(); addScore(-50); codeMsg="FALSCH! "+game.digits.join("")+" waere richtig"; codeCool=2; }
  }
  if(game.stageTime>120) nextStage();
}
function renderCODE(){
  cls();
  filled(0,0,W,16,INK);
  px("ZEITCODE EINGABE",4,3,.85,BG);
  outlined(4,20,W-8,56,INK2);
  px("Deine Ziffern aus",8,24,.85);
  px("den 4 Levels:",8,36,.85);
  px(game.digits.join("  "),20,50,1.2);
  px("CODE EINGEBEN:",4,84,1);
  codeDigits.forEach(function(d,i){
    var x=60+i*30;
    if(i===codePos){ filled(x-2,78,22,22,INK); px(d,x+3,81,1.4,BG); }
    else { outlined(x-2,78,22,22,INK2); px(d,x+3,81,1.4,INK); }
  });
  if(codeMsg){ filled(4,108,W-8,22,INK); px(codeMsg.substring(0,22),8,113,.8,BG); }
  else { px("Hoch/Runter=Zahl",4,110,.8,INK2); px("A=Bestaetigen",4,122,.8,INK2); }
}

// ========================
// DISPATCH
// ========================
function initStage(s){
  if(s==="BOOT")     initBoot();
  if(s==="INTRO")    initIntro();
  if(s==="BATTLE70") initBATTLE();
  if(s==="QUIZ80")   initQUIZ();
  if(s==="REAK90")   initREAK();
  if(s==="SORT")     initSORT();
  if(s==="CODE")     initCODE();
  if(s==="FINAL")    initFINAL();
}
function updateStage(s,dt){
  if(s==="BOOT")     updateBoot(dt);
  if(s==="INTRO")    updateIntro(dt);
  if(s==="BATTLE70") updateBATTLE(dt);
  if(s==="QUIZ80")   updateQUIZ(dt);
  if(s==="REAK90")   updateREAK(dt);
  if(s==="SORT")     updateSORT(dt);
  if(s==="CODE")     updateCODE(dt);
  if(s==="FINAL")    updateFINAL(dt);
}
function renderStage(s){
  if(s==="BOOT")     renderBoot();
  if(s==="INTRO")    renderIntro();
  if(s==="BATTLE70") renderBATTLE();
  if(s==="QUIZ80")   renderQUIZ();
  if(s==="REAK90")   renderREAK();
  if(s==="SORT")     renderSORT();
  if(s==="CODE")     renderCODE();
  if(s==="FINAL")    renderFINAL();
}

// ========================
// LOOP
// ========================
var last=performance.now();
function loop(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  game.stageTime+=dt; game.totalTime+=dt;
  hudTEl.textContent=fmtTime(game.totalTime);
  var s=game.stage;
  updateStage(s,dt);
  renderStage(s);
  prev.A=inp.A;prev.B=inp.B;prev.start=inp.start;
  prev.up=inp.up;prev.down=inp.down;prev.left=inp.left;prev.right=inp.right;
  requestAnimationFrame(loop);
}

initStage("BOOT");
renderBoot();
hudPEl.textContent="*0000";
hudTEl.textContent="00:00";
requestAnimationFrame(loop);
</script>
